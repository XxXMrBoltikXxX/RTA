<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>RTA Analyzer</title>
<style>
:root{--bg:#0c1014;--pn:#151b22;--ln:#2a333d;--fg:#dde4ea;--mut:#7d8a97;--tr:#4ade80;--pk:#fb923c}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,sans-serif}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#bar{display:flex;gap:6px;padding:8px;flex-wrap:wrap;align-items:center}
button,select,input{background:var(--pn);color:var(--fg);border:1px solid var(--ln);border-radius:6px;padding:8px 10px;font:inherit;min-width:0}
button.on{background:var(--tr);color:#04210f;border-color:var(--tr)}
#go{min-width:84px;font-weight:600}
#info{padding:2px 12px 6px;color:var(--mut);display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
#cv{flex:1;min-height:160px;width:100%;touch-action:none;display:block}
#panel{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;padding:8px}
label{display:flex;flex-direction:column;gap:3px;color:var(--mut);font-size:12px}
#micStatus{color:#93c5fd}#calStatus{color:var(--tr)}#exitFull{display:none;position:fixed;z-index:5;right:12px;top:12px}body.fullscreen #bar,body.fullscreen #info,body.fullscreen #panel{display:none}body.fullscreen #cv{min-height:0}body.fullscreen{padding:0}body.fullscreen #exitFull{display:block}
</style></head><body>
<div id="bar">
 <button id="go">Start</button><button id="pk">Peak hold</button><button id="rst">Reset peak</button>
 <button id="full">Fullscreen</button>
 <button id="sweep" title="Plays a low-level sine sweep through your selected output. Keep volume low.">Frequency sweep</button>
 <select id="eqFormat" aria-label="EQ export format"><option value="peace">Peace EQ</option><option value="poweramp">Poweramp EQ</option></select>
 <button id="exportEq" disabled>Export EQ</button>
 <button id="calBtn">Upload calibration</button><button id="clearCal">Clear calibration</button>
 <input id="calFile" type="file" accept=".txt,.csv,text/plain" hidden>
 <label style="min-width:170px">Microphone<select id="mic"><option value="">System default</option></select></label>
</div>
<div id="info"><span id="cur">Touch the graph to read values</span><span><span id="calStatus">No calibration loaded</span> · <span id="micStatus">Microphone: system default</span> · <span id="sweepStatus">Sweep: idle</span></span></div>
<canvas id="cv"></canvas>
<button id="exitFull">Exit fullscreen</button>
<div id="panel">
 <label>Smoothing<select id="oct"><option value="0">None</option><option value="1">1/1 oct</option><option value="3" selected>1/3 oct</option><option value="6">1/6 oct</option><option value="12">1/12 oct</option><option value="24">1/24 oct</option></select></label>
 <label>Averaging<select id="avg"><option value="1">Instant</option><option value="0.65">Fast</option><option value="0.3" selected>Medium</option><option value="0.1">Slow</option><option value="0.03">Very slow</option><option value="0.008">Ultra slow</option></select></label>
 <label>FFT size<select id="fft"><option>8192</option><option selected>16384</option><option>32768</option></select></label>
 <label>Sweep dwell<select id="sweepSpeed"><option value="0.25">Fast</option><option value="0.32" selected>Normal</option><option value="0.5">Slow</option></select></label>
 <label>Tilt (dB/oct)<select id="tilt"><option value="0">0 (flat)</option><option value="3">+3 (pink = flat)</option><option value="4.5">+4.5</option></select></label>
 <label>Top (dB)<input id="tp" type="number" value="0" step="5"></label>
 <label>Range (dB)<select id="rng"><option>60</option><option>80</option><option selected>100</option><option>120</option></select></label>
 <label>Level offset (dB)<input id="off" type="number" value="0" step="0.5"></label>
</div>
<script>
const $=id=>document.getElementById(id),cv=$('cv'),g=cv.getContext('2d');
const F0=20,F1=20000,L=36,B=16;
let ctx,an,stream,buf,pw,calPts=null,calBin=null,run=false,first=true,W=0,H=0,vals=null,peak=null,pkOn=false,cx=null;
let sweeping=false,sweepData=null,eqFilters=[];

let selectedMic=localStorage.getItem('rtaMic')||'';
function micKind(label){
 const s=(label||'').toLowerCase();
 return /(usb|external|dayton|measurement|audio interface)/.test(s)?'External':'Internal / built-in';
}
async function refreshMics(){
 if(!navigator.mediaDevices?.enumerateDevices)return;
 try{
  const devices=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audioinput');
  const sel=$('mic'),previous=selectedMic;
  sel.innerHTML='<option value="">System default</option>';
  devices.forEach((d,i)=>{const o=document.createElement('option');o.value=d.deviceId;o.textContent=(d.label||('Audio input '+(i+1)))+' · '+micKind(d.label);sel.appendChild(o)});
  if(previous&&devices.some(d=>d.deviceId===previous))sel.value=previous;
  else if(previous){selectedMic='';localStorage.removeItem('rtaMic');sel.value=''}
  updateMicStatus();
 }catch(e){$('micStatus').textContent='Microphone list unavailable'}
}
function updateMicStatus(){
 const o=[...$('mic').options].find(x=>x.value===$('mic').value);
 $('micStatus').textContent=o?o.textContent:'Microphone: system default';
}
$('mic').onchange=async()=>{
 selectedMic=$('mic').value;
 if(selectedMic)localStorage.setItem('rtaMic',selectedMic);else localStorage.removeItem('rtaMic');
 updateMicStatus();
 if(run){stop();await start()}
};
navigator.mediaDevices?.addEventListener?.('devicechange',refreshMics);
async function setFullscreen(on){
 if(on){document.body.classList.add('fullscreen');try{await document.documentElement.requestFullscreen?.()}catch(e){}}
 else{document.body.classList.remove('fullscreen');if(document.fullscreenElement)try{await document.exitFullscreen()}catch(e){}}
 setTimeout(rs,100);
}
$('full').onclick=()=>setFullscreen(true);
$('exitFull').onclick=()=>setFullscreen(false);
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)document.body.classList.remove('fullscreen');setTimeout(rs,100)});
refreshMics();

function parseCal(t){
  const p=[];
  for(const l of t.split(/\r?\n/)){
    const m=l.trim().split(/[\s,;]+/).map(Number);
    if(m.length>=2&&isFinite(m[0])&&isFinite(m[1])&&m[0]>0&&l.trim()!==''&&!/^[*"#]/.test(l.trim()))p.push([m[0],m[1]]);
  }
  p.sort((a,b)=>a[0]-b[0]);
  const u=p.filter((q,i)=>i===0||q[0]>p[i-1][0]);
  return u.length>=2?u:null;
}
function calAt(f){
  const a=calPts,n=a.length;
  if(f<=a[0][0])return a[0][1];
  if(f>=a[n-1][0])return a[n-1][1];
  let lo=0,hi=n-1;
  while(hi-lo>1){const m=(lo+hi)>>1;if(a[m][0]>f)hi=m;else lo=m}
  const t=Math.log(f/a[lo][0])/Math.log(a[hi][0]/a[lo][0]);
  return a[lo][1]+t*(a[hi][1]-a[lo][1]);
}
function buildCal(){
  if(!an)return;
  const n=an.frequencyBinCount,bh=ctx.sampleRate/an.fftSize;
  calBin=new Float32Array(n);
  if(calPts)for(let k=1;k<n;k++)calBin[k]=calAt(k*bh);
}
function setCal(t,name){
  const p=parseCal(t);
  if(!p){$('calStatus').textContent='Calibration file invalid';return false}
  calPts=p;$('calStatus').textContent='CALIBRATED · '+name+' · '+p.length+' points';
  buildCal();draw();return true;
}
$('calBtn').onclick=()=>$('calFile').click();
$('calFile').onchange=async e=>{
 const file=e.target.files?.[0];if(!file)return;
 try{
  const text=await file.text();
  if(!setCal(text,file.name))throw new Error('Could not read calibration points');
  $('calStatus').textContent='CALIBRATED · '+file.name;
 }catch(err){$('calStatus').textContent='Calibration file invalid';$('calStatus').title=err.message}
 e.target.value='';
};
$('clearCal').onclick=()=>{
 calPts=null;calBin=null;$('calStatus').textContent='No calibration loaded';draw();
};

function setFFT(){an.fftSize=+$('fft').value;buf=new Float32Array(an.frequencyBinCount);first=true;buildCal()}
$('fft').onchange=()=>{if(an)setFFT()};
async function start(){
  try{
    const audio={echoCancellation:false,noiseSuppression:false,autoGainControl:false,channelCount:1};
    if(selectedMic)audio.deviceId={exact:selectedMic};
    stream=await navigator.mediaDevices.getUserMedia({audio});
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    if(ctx.state!=='running')await ctx.resume();
    an=ctx.createAnalyser();an.smoothingTimeConstant=0;an.minDecibels=-120;an.maxDecibels=0;
    ctx.createMediaStreamSource(stream).connect(an);
    setFFT();
    run=true;first=true;$('go').textContent='Stop';$('go').classList.add('on');
    await refreshMics();
    const track=stream.getAudioTracks()[0],settings=track?.getSettings?.()||{};
    const found=[...$('mic').options].find(o=>o.value&&o.value===settings.deviceId);
    $('micStatus').textContent=found?found.textContent:(selectedMic?'Selected input (routing unconfirmed)':'Microphone: system default');
    if(navigator.wakeLock)navigator.wakeLock.request('screen').catch(()=>{});
    requestAnimationFrame(loop);
  }catch(e){
    if(stream)stream.getTracks().forEach(t=>t.stop());
    if(ctx)ctx.close();
    run=false;stream=null;ctx=null;an=null;
    $('go').textContent='Start';$('go').classList.remove('on');
    $('cur').textContent='Audio start error: '+e.message;
  }
}
function stop(){
  run=false;if(stream)stream.getTracks().forEach(t=>t.stop());if(ctx)ctx.close();
  an=null;stream=null;ctx=null;
  $('go').textContent='Start';$('go').classList.remove('on');
}
$('go').onclick=()=>run?stop():start();
$('pk').onclick=()=>{pkOn=!pkOn;$('pk').classList.toggle('on',pkOn);peak=null};
$('rst').onclick=()=>{peak=null};

function wait(ms){return new Promise(resolve=>setTimeout(resolve,ms))}
function median(values){
  const a=values.slice().sort((x,y)=>x-y),m=Math.floor(a.length/2);
  return a.length%2?a[m]:(a[m-1]+a[m])/2;
}
function interpolateLog(freqs,values,f){
  if(f<=freqs[0])return values[0];
  if(f>=freqs[freqs.length-1])return values[values.length-1];
  let i=0;while(i<freqs.length-1&&freqs[i+1]<f)i++;
  const t=Math.log(f/freqs[i])/Math.log(freqs[i+1]/freqs[i]);
  return values[i]+t*(values[i+1]-values[i]);
}
function buildEqProfile(){
  if(!sweepData)return;
  const smoothed=sweepData.response.map((v,i)=>{
    const a=sweepData.response[Math.max(0,i-1)],b=sweepData.response[Math.min(sweepData.response.length-1,i+1)];
    return (a+2*v+b)/4;
  });
  const centers=[31.5,63,125,250,500,1000,2000,4000,8000,16000];
  eqFilters=centers.map(fc=>({
    fc,
    gain:Math.max(-6,Math.min(6,-interpolateLog(sweepData.freqs,smoothed,fc))),
    q:1.0
  })).filter(f=>Math.abs(f.gain)>=0.25);
  $('exportEq').disabled=eqFilters.length===0;
}
function exportEqProfile(){
  if(!eqFilters.length)return;
  const format=$('eqFormat').value;
  const preamp=-(Math.max(0,...eqFilters.map(f=>f.gain))+1);
  let lines,filename;
  if(format==='peace'){
    lines=[
      '[General]',
      'Description=RTA Analyzer frequency sweep EQ',
      'PreAmp='+preamp.toFixed(1),
      '',
      '[Speakers]',
      'SpeakerId0=0',
      'SpeakerTargets0=all',
      'SpeakerName0=All',
      '',
      '[Frequencies]',
      ...eqFilters.map((f,i)=>'Frequency'+(i+1)+'='+f.fc),
      '',
      '[Gains]',
      ...eqFilters.map((f,i)=>'Gain'+(i+1)+'='+f.gain.toFixed(1)),
      '',
      '[Qualities]',
      ...eqFilters.map((f,i)=>'Quality'+(i+1)+'='+f.q.toFixed(2))
    ];
    filename='RTA_Peace_EQ.peace';
  }else{
    lines=[
      '# Poweramp Equalizer parametric AutoEQ preset',
      '# Generated by RTA Analyzer frequency sweep',
      'Preamp: '+preamp.toFixed(1)+' dB',
      ...eqFilters.map((f,i)=>'Filter '+(i+1)+': ON PK Fc '+f.fc+' Hz Gain '+f.gain.toFixed(1)+' dB Q '+f.q.toFixed(2))
    ];
    filename='RTA_Poweramp_EQ.txt';
  }
  const blob=new Blob([lines.join('\n')+'\n'],{type:'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
}
async function runSweep(){
  if(sweeping)return;
  if(!run)await start();
  if(!run||!ctx||!an)return;
  sweeping=true;$('sweep').disabled=true;$('exportEq').disabled=true;
  $('sweepStatus').textContent='Sweep: preparing';
  let osc=null,gain=null;
  try{
    const freqs=Array.from({length:31},(_,i)=>20*Math.pow(1000,i/30));
    const levels=[],duration=+$('sweepSpeed')?.value||0.32;
    osc=ctx.createOscillator();gain=ctx.createGain();
    osc.type='sine';gain.gain.setValueAtTime(0.04,ctx.currentTime);
    osc.connect(gain);gain.connect(ctx.destination);osc.start();
    const binHz=ctx.sampleRate/an.fftSize;
    for(let i=0;i<freqs.length;i++){
      if(!run||!ctx||!an)throw new Error('Microphone stopped during sweep');
      const f=freqs[i];osc.frequency.setTargetAtTime(f,ctx.currentTime,0.015);
      await wait(Math.max(60,duration*1000-100));
      let total=0,count=0;
      for(let s=0;s<5;s++){
        an.getFloatFrequencyData(buf);
        const center=Math.round(f/binHz);let level=-Infinity;
        for(let k=Math.max(1,center-1);k<=Math.min(buf.length-1,center+1);k++){
          const corrected=buf[k]-(calBin?calBin[k]:0);
          if(corrected>level)level=corrected;
        }
        if(isFinite(level)){total+=level;count++}
        await wait(20);
      }
      levels.push(count?total/count:-120);
      $('sweepStatus').textContent='Sweep: '+Math.round((i+1)/freqs.length*100)+'% · '+Math.round(f)+' Hz';
    }
    const ref=median(levels);
    sweepData={freqs,levels,response:levels.map(v=>v-ref),reference:ref};
    buildEqProfile();draw();
    $('sweepStatus').textContent='Sweep complete · '+eqFilters.length+' EQ bands ready';
  }catch(e){
    $('sweepStatus').textContent='Sweep failed: '+e.message;
  }finally{
    if(osc)try{osc.stop();osc.disconnect()}catch(e){}
    if(gain)try{gain.disconnect()}catch(e){}
    sweeping=false;$('sweep').disabled=false;
  }
}
$('sweep').onclick=runSweep;
$('exportEq').onclick=exportEqProfile;

function loop(){
  if(!run)return;
  an.getFloatFrequencyData(buf);
  const n=buf.length,a=+$('avg').value,o=+$('off').value,tl=+$('tilt').value,N=+$('oct').value;
  if(first){pw=new Float32Array(n)}
  for(let k=0;k<n;k++){
    const p=Math.pow(10,(buf[k]-(calBin?calBin[k]:0)+o)/10);
    pw[k]=first?p:pw[k]+a*(p-pw[k]);
  }
  first=false;
  const bh=ctx.sampleRate/an.fftSize,half=N?Math.pow(2,1/(2*N)):Math.pow(F1/F0,0.5/W);
  if(!vals||vals.length!==W)vals=new Float32Array(W);
  if(pkOn&&!peak)peak=new Float32Array(W).fill(-999);
  for(let x=0;x<W;x++){
    const fc=F0*Math.pow(F1/F0,x/(W-1)),lo=fc/half/bh,hi=fc*half/bh;
    let v;
    if(hi-lo<1){const c=(lo+hi)/2,i=Math.min(Math.floor(c),n-2),t=c-i;v=pw[i]*(1-t)+pw[i+1]*t}
    else{
      const i0=Math.max(1,Math.ceil(lo)),i1=Math.min(n-1,Math.floor(hi));let sum=0;
      for(let i=i0;i<=i1;i++)sum+=pw[i];
      v=i1>=i0?sum/(i1-i0+1):pw[n-1];
    }
    vals[x]=10*Math.log10(v+1e-20)+tl*Math.log2(fc/1000);
    if(peak&&vals[x]>peak[x])peak[x]=vals[x];
  }
  draw();requestAnimationFrame(loop);
}

function draw(){
  if(!W)return;
  const top=+$('tp').value,rg=+$('rng').value,ph=H-B-4,step=rg<=60?10:20;
  g.clearRect(0,0,W+L+6,H);g.font='10px system-ui';g.lineWidth=1;g.textBaseline='middle';
  for(let d=Math.ceil((top-rg)/step)*step;d<=top;d+=step){
    const y=4+(top-d)/rg*ph;g.strokeStyle='#1f2730';g.beginPath();g.moveTo(L,y);g.lineTo(L+W,y);g.stroke();
    g.fillStyle='#7d8a97';g.textAlign='right';g.fillText(d,L-4,y);
  }
  const fx=f=>L+Math.log(f/F0)/Math.log(F1/F0)*(W-1);
  g.textAlign='center';
  for(const f of [20,50,100,200,500,1000,2000,5000,10000,20000]){
    g.strokeStyle='#1f2730';g.beginPath();g.moveTo(fx(f),4);g.lineTo(fx(f),4+ph);g.stroke();
    g.fillStyle='#7d8a97';g.fillText(f>=1000?f/1000+'k':f,Math.min(Math.max(fx(f),L+8),L+W-8),H-7);
  }
  const yy=v=>Math.max(4,Math.min(4+ph,4+(top-v)/rg*ph));
  const path=arr=>{g.beginPath();for(let x=0;x<W;x++){x?g.lineTo(L+x,yy(arr[x])):g.moveTo(L+x,yy(arr[x]))}};
  if(vals&&vals.length===W){
    path(vals);g.strokeStyle='#4ade80';g.lineWidth=1.5;g.stroke();
    g.lineTo(L+W-1,4+ph);g.lineTo(L,4+ph);g.fillStyle='rgba(74,222,128,.14)';g.fill();
    if(peak){path(peak);g.strokeStyle='#fb923c';g.lineWidth=1;g.stroke()}
    if(sweepData){g.beginPath();for(let i=0;i<sweepData.freqs.length;i++){const x=fx(sweepData.freqs[i]),y=yy(sweepData.levels[i]);i?g.lineTo(x,y):g.moveTo(x,y)}g.strokeStyle='#60a5fa';g.lineWidth=2;g.stroke()}
    if(cx!==null&&cx>=0&&cx<W){
      g.strokeStyle='#dde4ea';g.beginPath();g.moveTo(L+cx,4);g.lineTo(L+cx,4+ph);g.stroke();
      const f=F0*Math.pow(F1/F0,cx/(W-1));
      $('cur').textContent=(f>=1000?(f/1000).toFixed(2)+' kHz':f.toFixed(0)+' Hz')+'  '+vals[cx].toFixed(1)+' dB'+(peak?'  (pk '+peak[cx].toFixed(1)+')':'');
    }
  }
}
function rs(){
  const d=devicePixelRatio||1,r=cv.getBoundingClientRect();
  cv.width=r.width*d;cv.height=r.height*d;g.setTransform(d,0,0,d,0,0);
  W=Math.floor(r.width-L-6);H=r.height;vals=null;peak=null;draw();
}
cv.addEventListener('pointerdown',e=>{cx=Math.round(e.offsetX-L);draw()});
cv.addEventListener('pointermove',e=>{cx=Math.round(e.offsetX-L);if(!run)draw()});
['tp','rng'].forEach(id=>$(id).oninput=draw);
addEventListener('resize',rs);rs();
</script></body></html>
